#   R (БП на 2 часа) = БП / 30 / 12 × 1000;  S = итог суток × 30;
#   Q36 «Сжигание ПНГ – БП» = добыча ПНГ – БП − использование ПНГ – БП;
#   Q93 «Поставка СОГ в ЕСГ – БП» = поставка ПНГ в ЕСГ – БП + поставка ПГ в ЕСГ – БП.
