# ============================================================
#  Плановые показатели (БП) и коэффициенты расчёта сводки.
#  Значения попадают в столбцы Q и R каждого дневного листа.
#  Меняйте только числа и даты после «=»; строки с # — пояснения.
#  Файл перечитывается при каждой сборке — перезапускать программу не нужно.
#  Дробная часть пишется через точку: 0.67, а не 0,67.
#  Дата пишется так: 2026-06-01 (год-месяц-день, без кавычек).
# ============================================================

# ---------- Бизнес-план (БП), столбец Q ----------
